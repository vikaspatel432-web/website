    <meta property="og:image:height" content="630" />

    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:description"
      content="Multi-discipline BIM modelling, clash detection, 4D/5D simulation, reality capture and live analytics."
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>SP Consultants — BIM Consultancy &amp; AEC Construction Technology</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "SP Consultants",
        "description": "BIM consultancy and AEC construction technology — multi-discipline BIM modelling, clash detection, 4D/5D simulation, reality capture, planning and data analytics.",
        "url": "https://spconsultants.info/",
        "logo": "https://spconsultants.info/logo.png",
        "image": "https://spconsultants.info/og-image.jpg",
        "email": "admin@spconsultants.info",
        "telephone": "+91-94285-10353",
        "areaServed": "Worldwide",
        "address": { "@type": "PostalAddress", "addressCountry": "IN" },
        "knowsAbout": [
          "Building Information Modelling",
          "Scan to BIM",
          "Clash Detection",
          "4D Simulation",
          "5D Cost Control",
          "Laser Scanning",
          "Reality Capture",
          "Construction Data Analytics"
        ]
      }
    </script>
    <script>
      // Apply saved theme before paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('sp-theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Hidden static form so Netlify detects the contact form at build time. -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <select name="service"></select>
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
