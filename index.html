<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SP Consultants — BIM consultancy and AEC construction technology. Multi-discipline BIM modelling, clash detection, 4D/5D simulation, reality capture, planning & data analytics. Transforming visions into reality."
    />
    <meta name="theme-color" content="#156082" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>SP Consultants — BIM Consultancy &amp; AEC Construction Technology</title>
    <script>
      // Apply saved theme before paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('sp-theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Hidden static form so Netlify detects the contact form at build time. -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <select name="service"></select>
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
